name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build hatchling

      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Run offline tests
        run: pytest --cov=bedboy --cov-report=term-missing

      - name: Build and install the wheel
        run: |
          python -m build --no-isolation
          pip install --force-reinstall --no-deps dist/*.whl
          pip check

      - name: Smoke-test the installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          bedboy --version
          python -m bedboy --help
          bedboy sources -g hg38 --no-color
          bedboy annotate "$GITHUB_WORKSPACE/tests/data/mini_input.bed" -g hg38 \
            --annotation-file "$GITHUB_WORKSPACE/tests/data/mini.genes.bed" \
            -q -o annotated.bed
          python -c 'from pathlib import Path; p = Path("annotated.bed"); assert p.read_text().splitlines()[0] == "chr1\t1600\t1700\tAAA"'
